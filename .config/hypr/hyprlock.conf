general {
    no_fade_in = false
    grace = 0
    disable_loading = true
}

background {
    monitor =
    path = screenshot
    color = rgba(25, 20, 20, 1.0)
    blur_passes = 3
    blur_size = 12
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.5
    vibrancy = 0.3
}

# --- 3D CYBER-STYLE Arch Linux ---

# Глубокая черная тень (самый нижний слой)
label {
    monitor =
    text = Arch Linux
    color = rgba(0, 0, 0, 0.8)
    font_size = 120
    font_family = Monospace Bold
    position = 8, 172
    halign = center
    valign = center
}

# Фиолетовый неон (Electric Purple)
label {
    monitor =
    text = Arch Linux
    color = rgba(191, 0, 255, 0.7)
    font_size = 120
    font_family = Monospace Bold
    position = 4, 176
    halign = center
    valign = center
}

# Золотой акцент (Cyber Gold)
label {
    monitor =
    text = Arch Linux
    color = rgba(255, 170, 0, 0.7)
    font_size = 120
    font_family = Monospace Bold
    position = -4, 184
    halign = center
    valign = center
}

# Основной белый (с легкой прозрачностью)
label {
    monitor =
    text = Arch Linux
    color = rgba(240, 240, 240, 0.9)
    font_size = 120
    font_family = Monospace Bold
    position = 0, 180
    halign = center
    valign = center
}

# --- ВТОРОСТЕПЕННЫЕ ЭЛЕМЕНТЫ ---

# Часы
label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 0.5)
    font_size = 30
    font_family = Monospace
    position = 0, 65
    halign = center
    valign = center
}

# Поле ввода
input-field {
    monitor =
    size = 320, 55
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.4
    dots_center = true
    outer_color = rgba(191, 0, 255, 0.3)
    inner_color = rgba(0, 0, 0, 0.7)
    font_color = rgb(255, 255, 255)
    fade_on_empty = false
    rounding = 0
    placeholder_text = <span foreground="##ffffff66">ENTER PASS</span>
    hide_input = false
    position = 0, -50
    halign = center
    valign = center
}

# Раскладка
label {
    monitor =
    text = $LAYOUT
    color = rgba(255, 255, 255, 0.3)
    font_size = 9
    font_family = Monospace
    position = 0, -95
    halign = center
    valign = center
}
