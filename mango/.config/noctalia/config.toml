config_version = 20

[shell]
avatar_path = "/home/yarick/.face"
font_family = "JetBrains Mono"
time_format = "{:%H:%M}"

    [shell.animation]
    enabled = true
    speed = 1.6

    [shell.screenshot]
    annotate = true
    close_on_copy = true
    close_on_save = true
    confirm_region = false
    copy_on_close = true
    copy_to_clipboard = true
    format = "png"
    freeze_screen = true
    save_to_file = true
    show_region_dimensions = true
    show_region_hint = true
    skip_annotate_on_copy_save = false

[bar]
order = [ "default" ]

    [bar.default]
    background_opacity = 0.92
    center = [ "date", "clock", "weather" ]
    compositor_blur = true
    enabled = true
    end = [
        "media",
        "keyboard_layout",
        "tray",
        "notifications",
        "clipboard",
        "network",
        "bluetooth",
        "input_volume",
        "volume",
        "control-center",
        "session"
    ]
    font_scale = 1.0
    layer = "top"
    margin_ends = 16
    padding = 14
    position = "top"
    radius = 12
    reserve_space = true
    shadow = true
    show_on_workspace_switch = true
    show_tooltip = true
    start = [ "launcher", "wallpaper", "workspaces", "active_window" ]
    thickness = 34
    widget_spacing = 8

[location]
address = "Krasnodar"
auto_locate = false

[weather]
effects = true
enabled = true
refresh_minutes = 30
unit = "metric"

[widget.weather]
type = "weather"

[widget.workspaces]
active_pill_size = 3.2
inactive_pill_size = 1.6
pill_scale = 0.9
scale = 1.2
type = "workspaces"

[widget.active_window]
icon_size = 16.0
max_length = 260.0
min_length = 80.0
title_scroll = "none"
type = "active_window"

[widget.date]
format = "{:%a %d %b}"
type = "clock"

[widget.keyboard_layout]
hide_when_single_layout = false
type = "keyboard_layout"

[widget.input_volume]
device = "input"
type = "volume"

[theme]
mode = "dark"
shell_mode = "dark"
source = "wallpaper"
sync_color_scheme = true
terminal_colors = "palette"
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    builtin_ids = [
        "mango",
        "ghostty",
        "kitty",
        "btop",
        "gtk3",
        "gtk4",
        "qt",
        "kcolorscheme"
    ]
    community_ids = [
        "lazyvim",
        "zed",
        "yazi",
        "tmux",
        "opencode",
        "pi-agent",
        "antigravity",
        "brave",
        "telegram"
    ]
    enable_builtin_templates = true
    enable_community_templates = true

[wallpaper]
directory = "/home/yarick/Pictures/Wallpapers"
enabled = true

[wallpaper.default]
path = "/home/yarick/Pictures/Wallpapers/pixiewall-ut4s91-7680x3240.jpg"

[wallpaper.last]
path = "/home/yarick/Pictures/Wallpapers/pixiewall-ut4s91-7680x3240.jpg"

[wallpaper.monitors.DP-3]
path = "/home/yarick/Pictures/Wallpapers/pixiewall-ut4s91-7680x3240.jpg"

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = false
    timeout = 600.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = false
    timeout = 660.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

[lockscreen]
enabled = true
lock_before_suspend = false

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-3", "lockscreen-login-box@HDMI-A-5" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-3"]
    box_height = 196.0
    box_width = 810.0
    cx = 1720.0
    cy = 1258.0
    output = "DP-3"
    placement_height = 1440.0
    placement_width = 3440.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-3".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_media_controls = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-5"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "HDMI-A-5"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-5".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_media_controls = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true
