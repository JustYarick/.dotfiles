# ============================================================
# MangoWC (MangoWM 0.18+) — конфиг в стиле Hyprland (из .dotfiles)
# Мониторы:
#   DP-3     : Xiaomi 3440x1440 @ 180Hz (основной, 21:9, слева)
#   HDMI-A-5 : ViewSonic 1920x1080 @ 60Hz (второй, справа)
# ============================================================

# --- Переменные окружения (NVIDIA + Wayland) ---
env=GBM_BACKEND,nvidia-drm
env=__GLX_VENDOR_LIBRARY_NAME,nvidia
env=LIBVA_DRIVER_NAME,nvidia
env=NVD_BACKEND,direct
env=QT_QPA_PLATFORM,wayland
env=ELECTRON_OZONE_PLATFORM_HINT,auto

# --- Автостарт ---
exec_once=dbus-update-activation-environment --systemd --all
exec_once=/usr/libexec/polkit-mate-authentication-agent-1
exec_once=noctalia --daemon

# --- Мониторы ---
monitor_rule=name:DP-3,rr:0,scale:1,x:0,y:0,width:3440,height:1440,refresh:180
monitor_rule=name:HDMI-A-5,rr:0,scale:1,x:3440,y:0,width:1920,height:1080,refresh:60
monitor_rule=name:HDMI-A-1,rr:0,scale:1,x:3440,y:0,width:1920,height:1080,refresh:60

# --- Режим как в Hyprland (dwindle по умолчанию) ---
tag_rule=id:1,layout_name:dwindle
tag_rule=id:2,layout_name:dwindle
tag_rule=id:3,layout_name:dwindle
tag_rule=id:4,layout_name:dwindle
tag_rule=id:5,layout_name:dwindle
tag_rule=id:6,layout_name:dwindle
tag_rule=id:7,layout_name:dwindle
tag_rule=id:8,layout_name:dwindle
tag_rule=id:9,layout_name:dwindle

dwindle_preserve_split=1
dwindle_drop_simple_split=1
dwindle_smart_split=0
# ВАЖНО: dwindle_smart_resize=0, иначе в правом/нижнем окне инвертируется направление тяги!
dwindle_smart_resize=0
default_master_factor=0.50
default_master_count=1

# --- Ресайз окон (как в Hyprland) ---
# drag_corner=4 — хватать ближайший к курсору угол/сторону (а не только правый нижний угол)
drag_corner=4
drag_warp_cursor=0
# Прямой ресайз мышью за границу между окнами
enable_border_resize=1
border_resize_size=12

# --- Фокус и поведение ---
sloppy_focus=1
warp_cursor=0
focus_on_activate=1

# --- Производительность и игры ---
sync_obj_enable=1
float_full_to_top=1
xwayland_ignore_scale=0

# --- Быстрые анимации (как speed=2 в Hyprland) ---
animations=1
layer_animations=0
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
animation_duration_open=170
animation_duration_close=140
animation_duration_move=170
animation_duration_tag=170
animation_duration_focus=0
animation_curve_open=0.16,1.0,0.3,1.0
animation_curve_move=0.16,1.0,0.3,1.0
animation_curve_tag=0.16,1.0,0.3,1.0
animation_curve_close=0.16,1.0,0.3,1.0

# --- Визуал (как в Hyprland .dotfiles) ---
focused_opacity=1.0
unfocused_opacity=0.95
blur=1
blur_optimized=1
blur_params_num_passes=2
blur_params_radius=4
shadows=1
border_radius=10
gap_inner_horizontal=6
gap_inner_vertical=6
gap_outer_horizontal=8
gap_outer_vertical=8
border_px=2

# --- Клавиатура и мышь (как в desktop/.config/hypr/configs/input.lua) ---
xkb_rules_layout=us,ru
xkb_rules_options=grp:alt_shift_toggle
repeat_rate=30
repeat_delay=270
numlock_on=1

# Мышь: плоский профиль (без акселерации), чувствительность 0
mouse_accel_profile=1
mouse_accel_speed=0
mouse_natural_scrolling=0
cursor_size=24

# --- Приложения (твои бинды из .dotfiles) ---
bind=SUPER,Return,spawn,ghostty
bind=SUPER+SHIFT,Return,spawn,brave-browser
bind=SUPER,Space,spawn,noctalia msg panel-toggle launcher
bind=SUPER,B,spawn,firefox
bind=SUPER,E,spawn,nautilus
bind=SUPER+SHIFT,F,spawn,nautilus
bind=SUPER+SHIFT,D,spawn,flatpak run com.discordapp.Discord
bind=SUPER+ALT,T,spawn,Telegram
bind=SUPER+SHIFT,T,spawn,Telegram

# --- Noctalia Shell (центры, уведомления, блокировка, меню выключения) ---
bind=SUPER,N,spawn,noctalia msg panel-toggle control-center notifications
bind=SUPER+SHIFT,N,spawn,noctalia msg panel-toggle control-center home
bind=SUPER+ALT,L,spawn,noctalia msg session lock
bind=SUPER,Escape,spawn,noctalia msg session lock
bind=SUPER,X,spawn,noctalia msg panel-toggle session

# --- Управление окнами (как в твоём Hyprland keybinds.conf) ---
bind=SUPER,W,killclient
bind=SUPER,Q,killclient
bind=SUPER,M,quit
bind=SUPER,T,togglefloating
bind=SUPER,F,togglefullscreen
bind=SUPER,R,dwindle_toggle_current_split
bind=SUPER,G,dwindle_toggle_current_split
bind=SUPER+SHIFT,BackSpace,togglegaps
bind=SUPER+SHIFT,Space,switch_layout
bind=SUPER+SHIFT,R,reload_config

# Фокус окон (hjkl и стрелки)
bind=SUPER,h,focusdir,left
bind=SUPER,j,focusdir,down
bind=SUPER,k,focusdir,up
bind=SUPER,l,focusdir,right
bind=SUPER,Left,focusdir,left
bind=SUPER,Down,focusdir,down
bind=SUPER,Up,focusdir,up
bind=SUPER,Right,focusdir,right

# Перемещение окон (SUPER + SHIFT + hjkl / стрелки)
bind=SUPER+SHIFT,h,move_client,left
bind=SUPER+SHIFT,j,move_client,down
bind=SUPER+SHIFT,k,move_client,up
bind=SUPER+SHIFT,l,move_client,right
bind=SUPER+SHIFT,Left,move_client,left
bind=SUPER+SHIFT,Down,move_client,down
bind=SUPER+SHIFT,Up,move_client,up
bind=SUPER+SHIFT,Right,move_client,right

# Изменение размера окон с клавиатуры (SUPER + - / = и SUPER + CTRL + стрелки/hjkl)
bind=SUPER,minus,resizewin,-40,+0
bind=SUPER+SHIFT,minus,resizewin,+0,-40
bind=SUPER,equal,resizewin,+40,+0
bind=SUPER+SHIFT,equal,resizewin,+0,+40
bind=SUPER+CTRL,Left,resizewin,-40,+0
bind=SUPER+CTRL,Right,resizewin,+40,+0
bind=SUPER+CTRL,Up,resizewin,+0,-40
bind=SUPER+CTRL,Down,resizewin,+0,+40
bind=SUPER+CTRL,h,resizewin,-40,+0
bind=SUPER+CTRL,l,resizewin,+40,+0
bind=SUPER+CTRL,k,resizewin,+0,-40
bind=SUPER+CTRL,j,resizewin,+0,+40

# Переключение мониторов
bind=SUPER+ALT,Left,focusmon,left
bind=SUPER+ALT,Right,focusmon,right
bind=SUPER+SHIFT+ALT,Left,tagmon,left
bind=SUPER+SHIFT+ALT,Right,tagmon,right

# Переключение тегов (1..9)
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

# Отправить окно на тег (1..9)
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# Мышь (перетаскивание и ресайз окон с SUPER)
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# Скриншот с встроенным редактором Noctalia (стрелочки, рамки, маркер, текст — как в Flameshot)
bind=NONE,Print,spawn,noctalia msg screenshot-region --annotate
bind=SUPER+SHIFT,S,spawn,noctalia msg screenshot-region --annotate
bind=SUPER,Print,spawn,noctalia msg screenshot-window --annotate
bind=SUPER+SHIFT,Print,spawn,noctalia msg screenshot-fullscreen --annotate

# Громкость и яркость через Noctalia OSD
bind=NONE,XF86AudioRaiseVolume,spawn,noctalia msg volume-up
bind=NONE,XF86AudioLowerVolume,spawn,noctalia msg volume-down
bind=NONE,XF86AudioMute,spawn,noctalia msg volume-mute
bind=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind=NONE,XF86MonBrightnessUp,spawn,noctalia msg brightness-up
bind=NONE,XF86MonBrightnessDown,spawn,noctalia msg brightness-down

# Динамическая тема Noctalia (если сгенерирована)
source-optional=~/.config/mango/noctalia.conf
